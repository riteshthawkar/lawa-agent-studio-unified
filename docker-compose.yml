version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MAIN DJANGO BACKEND (Port 8000)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lawa-backend:latest
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - shared_data:/app/data # Shared data directory
    depends_on:
      redis:
        condition: service_healthy
      indexing-service:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      # Use DB credentials from .env file (managed database)
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS=True
      # Override localhost with container name for internal communication
      - INDEXING_API_BASE=http://indexing-service:8080
      - CHATBOT_API_BASE=http://chatbot-service:8002
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 lawa_platform.wsgi:application

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lawa-backend:latest
    restart: always
    volumes:
      - shared_data:/app/data
    depends_on:
      - redis
    env_file:
      - ./backend/.env
    environment:
      # Use DB credentials from .env file (managed database)
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS=True
      - INDEXING_API_BASE=http://indexing-service:8080
    command: celery -A lawa_platform worker -l info

  # ---------------------------------------------------------------------------
  # WEBSITE INDEXING SERVICE (Port 8080)
  # ---------------------------------------------------------------------------
  indexing-service:
    build:
      context: .
      dockerfile: website_indexing_backend/Dockerfile
    image: lawa-indexing-service:latest
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - shared_data:/app/data # Writes files here
    env_file:
      - ./website_indexing_backend/.env
    environment:
      - DATA_DIR=/app/data
      # Use DB credentials from .env file (managed database)
    command: python start_api.py --host 0.0.0.0 --port 8080

  # ---------------------------------------------------------------------------
  # CHATBOT WIDGET BACKEND (Port 8002)
  # ---------------------------------------------------------------------------
  chatbot-service:
    build:
      context: ./EMBEDDED_CHATBOT/backend
      dockerfile: Dockerfile
    image: lawa-chatbot-service:latest
    restart: always
    ports:
      - "8002:8002"
    volumes:
      - shared_data:/app/data
    depends_on:
      - redis
    env_file:
      - ./EMBEDDED_CHATBOT/backend/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8002
      # Use DB credentials from .env file (managed database)
    command: python main.py

volumes:
  redis_data:
  shared_data:


networks:
  default:
    name: lawa-network
