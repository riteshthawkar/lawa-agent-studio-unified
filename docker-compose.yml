version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MAIN DJANGO BACKEND (Port 8000)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backends/core
      dockerfile: Dockerfile
    image: lawa-backend:latest
    container_name: lawa-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - shared_data:/app/data # Shared data directory
      # Mount source code for optional hot-reloading (remove in prod if prefer immutable)
      - ./backends/core:/app
    depends_on:
      redis:
        condition: service_healthy
      indexing-service:
        condition: service_started
    env_file:
      - ./backends/core/.env
    environment:
      # DB Credentials are read effectively from .env file now.
      - REDIS_URL=redis://redis:6379/1
      - USE_REDIS=True
      # Internal service URLs
      - INDEXING_API_BASE=http://indexing-service:8080
      - CHATBOT_API_BASE=http://chatbot-service:8002
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 lawa_platform.wsgi:application

  backend-worker:
    build:
      context: ./backends/core
      dockerfile: Dockerfile
    image: lawa-backend:latest
    container_name: lawa-backend-worker
    restart: always
    volumes:
      - shared_data:/app/data
      - ./backends/core:/app
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./backends/core/.env
    environment:
      # DB Credentials are read effectively from .env file now.
      - REDIS_URL=redis://redis:6379/1
      - USE_REDIS=True
      - INDEXING_API_BASE=http://indexing-service:8080
    command: celery -A lawa_platform worker -l info

  # ---------------------------------------------------------------------------
  # WEBSITE INDEXING SERVICE (Port 8080)
  # ---------------------------------------------------------------------------
  indexing-service:
    build:
      context: .
      dockerfile: backends/indexing/Dockerfile
    image: lawa-indexing-service:latest
    container_name: lawa-indexing-service
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - shared_data:/app/data
      - ./backends/indexing:/app/website_indexing_backend
      - ./backends/core:/app/core
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./backends/indexing/.env
    environment:
      - DATA_DIR=/app/data
      - REDIS_URL=redis://redis:6379/2
      - USE_CELERY_WORKER=True
      # DB Credentials are read effectively from .env file now.
    command: uvicorn app:app --host 0.0.0.0 --port 8080 --workers 2

  # ---------------------------------------------------------------------------
  # INDEXING WORKERS - Split into priority queues for better resource management
  # ---------------------------------------------------------------------------
  # Worker 1: HIGH PRIORITY - Small/quick jobs (< 50 pages)
  # Ensures small jobs complete quickly without being blocked by large jobs
  indexing-worker-priority:
    build:
      context: .
      dockerfile: backends/indexing/Dockerfile
    image: lawa-indexing-service:latest
    container_name: lawa-indexing-worker-priority
    restart: always
    volumes:
      - shared_data:/app/data
      - ./backends/indexing:/app/website_indexing_backend
      - ./backends/core:/app/core
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./backends/indexing/.env
    environment:
      - DATA_DIR=/app/data
      - REDIS_URL=redis://redis:6379/2
      - USE_CELERY_WORKER=True
      - CELERY_WORKER_CONCURRENCY=2
      # Per-job rate limiting: each job gets fair share of API quota
      - GEMINI_RATE_LIMIT=120
      - ENABLE_PER_JOB_RATE_LIMIT=True
    command: celery -A celery_app worker -l info -Q indexing_priority,celery --hostname=priority@%h
    healthcheck:
      test: [ "CMD-SHELL", "celery -A celery_app inspect ping -d celery@$$HOSTNAME" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

  # Worker 2: DEFAULT - Large/heavy jobs (>= 50 pages)
  # Handles resource-intensive jobs without blocking priority queue
  indexing-worker-default:
    build:
      context: .
      dockerfile: backends/indexing/Dockerfile
    image: lawa-indexing-service:latest
    container_name: lawa-indexing-worker-default
    restart: always
    volumes:
      - shared_data:/app/data
      - ./backends/indexing:/app/website_indexing_backend
      - ./backends/core:/app/core
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./backends/indexing/.env
    environment:
      - DATA_DIR=/app/data
      - REDIS_URL=redis://redis:6379/2
      - USE_CELERY_WORKER=True
      - CELERY_WORKER_CONCURRENCY=2
      # Per-job rate limiting: each job gets fair share of API quota
      - GEMINI_RATE_LIMIT=120
      - ENABLE_PER_JOB_RATE_LIMIT=True
    command: celery -A celery_app worker -l info -Q indexing_default,celery --hostname=default@%h
    healthcheck:
      test: [ "CMD-SHELL", "celery -A celery_app inspect ping -d celery@$$HOSTNAME" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 512M

  # ---------------------------------------------------------------------------
  # CHATBOT WIDGET BACKEND (Port 8002)
  # ---------------------------------------------------------------------------
  chatbot-service:
    build:
      context: ./backends/widget
      dockerfile: Dockerfile
    image: lawa-chatbot-service:latest
    container_name: lawa-chatbot-service
    restart: always
    ports:
      - "8002:8002"
    volumes:
      - shared_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./backends/widget/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8002
      # Use a separate Redis DB? Or just default. Assuming default /0 or shared env.
      # If chatbot needs Redis, ensure URL is set. The previous file didn't set explicit REDIS_URL in env override.
      - REDIS_URL=redis://redis:6379/0
    command: python main.py

volumes:
  redis_data:
  shared_data:


networks:
  default:
    name: lawa-network
