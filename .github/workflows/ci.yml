name: Comprehensive CI Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # Backend Core Tests (Django)
  # ============================================================
  backend-core-tests:
    name: Backend Core Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_webbotify
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backends/core/requirements.txt

      - name: Install dependencies
        working-directory: backends/core
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov pytest-asyncio

      - name: Run Django migrations
        working-directory: backends/core
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_webbotify
          DJANGO_SETTINGS_MODULE: core.settings
          SECRET_KEY: test-secret-key-for-ci
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py migrate --run-syncdb

      - name: Run Backend Core Tests
        working-directory: backends/core
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_webbotify
          DJANGO_SETTINGS_MODULE: core.settings
          SECRET_KEY: test-secret-key-for-ci
          REDIS_URL: redis://localhost:6379/0
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m pytest apps/ \
            --ignore=apps/frontend/tests \
            -v \
            --tb=short \
            --cov=apps \
            --cov-report=xml \
            --cov-report=term-missing \
            -x

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: backends/core/coverage.xml
          flags: backend-core
          name: backend-core-coverage

  # ============================================================
  # Backend Indexing Tests
  # ============================================================
  backend-indexing-tests:
    name: Backend Indexing Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_indexing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backends/indexing/requirements.txt

      - name: Install dependencies
        working-directory: backends/indexing
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run Indexing Tests
        working-directory: backends/indexing
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_indexing
          REDIS_URL: redis://localhost:6379/0
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CELERY_BROKER_URL: redis://localhost:6379/1
          INDEXING_API_TOKEN: test-token
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --cov=modules \
            --cov-report=xml \
            --cov-report=term-missing \
            --ignore=tests/test_stress.py \
            --ignore=tests/test_e2e_pipeline.py \
            -x

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: backends/indexing/coverage.xml
          flags: backend-indexing
          name: backend-indexing-coverage

  # ============================================================
  # Frontend Tests (Vitest + React Testing Library)
  # ============================================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontends/app/package-lock.json

      - name: Install dependencies
        working-directory: frontends/app
        run: npm ci

      - name: Run Vitest tests
        working-directory: frontends/app
        run: npm run test -- --run --coverage
        continue-on-error: true

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: frontends/app/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

  # ============================================================
  # Linting and Code Quality
  # ============================================================
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python linting tools
        run: |
          pip install flake8 black isort

      - name: Run flake8 on backend core
        working-directory: backends/core
        run: |
          flake8 apps/ --max-line-length=120 --ignore=E501,W503,E203 --count --statistics
        continue-on-error: true

      - name: Run flake8 on indexing
        working-directory: backends/indexing
        run: |
          flake8 modules/ --max-line-length=120 --ignore=E501,W503,E203 --count --statistics
        continue-on-error: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontends/app/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontends/app
        run: npm ci

      - name: Run ESLint
        working-directory: frontends/app
        run: npm run lint || true

  # ============================================================
  # Security Scanning
  # ============================================================
  security:
    name: Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Run Bandit (Python Security)
        working-directory: backends/core
        run: |
          bandit -r apps/ -ll -ii --skip B101,B104,B311 -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Run Safety (Dependency Check)
        working-directory: backends/core
        run: |
          safety check -r requirements.txt --output json > safety-report.json || true
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            backends/core/bandit-report.json
            backends/core/safety-report.json

  # ============================================================
  # Build Verification
  # ============================================================
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [backend-core-tests, backend-indexing-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Core Docker image
        run: |
          if [ -f backends/core/Dockerfile ]; then
            docker build -t webbotify-core:test backends/core
          else
            echo "No Dockerfile found for core, skipping"
          fi

      - name: Build Indexing Docker image
        run: |
          if [ -f backends/indexing/Dockerfile ]; then
            docker build -t webbotify-indexing:test backends/indexing
          else
            echo "No Dockerfile found for indexing, skipping"
          fi

      - name: Build Frontend
        working-directory: frontends/app
        run: |
          npm ci
          npm run build || echo "Build script not found or failed"

  # ============================================================
  # Integration Tests (Optional - requires full env)
  # ============================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-core-tests, backend-indexing-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Core dependencies
        working-directory: backends/core
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-asyncio

      - name: Run System Tests
        working-directory: backends/core
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_integration
          DJANGO_SETTINGS_MODULE: core.settings
          SECRET_KEY: test-secret-key-for-ci
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py migrate --run-syncdb
          python -m pytest system_tests/ -v --tb=short || echo "No system tests found"

  # ============================================================
  # Test Summary
  # ============================================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-core-tests, backend-indexing-tests, frontend-tests, lint, security]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "=== Test Summary ==="
          echo "Backend Core Tests: ${{ needs.backend-core-tests.result }}"
          echo "Backend Indexing Tests: ${{ needs.backend-indexing-tests.result }}"
          echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Security: ${{ needs.security.result }}"

          if [ "${{ needs.backend-core-tests.result }}" = "failure" ] || \
             [ "${{ needs.backend-indexing-tests.result }}" = "failure" ]; then
            echo "::error::Critical tests failed!"
            exit 1
          fi

          echo "All critical tests passed!"
