version: '3.8'

services:
  # Website Indexing API
  indexing-api:
    build:
      context: ../
      dockerfile: website_indexing_backend/Dockerfile
    image: website-indexing-api:latest
    container_name: indexing-api
    ports:
      - "8080:8080"
    environment:
      # Load from .env file
      - LAWA_DB_PG_HOST=${LAWA_DB_PG_HOST}
      - LAWA_DB_PG_PORT=${LAWA_DB_PG_PORT}
      - LAWA_DB_PG_USER=${LAWA_DB_PG_USER}
      - LAWA_DB_PG_PASSWORD=${LAWA_DB_PG_PASSWORD}
      - LAWA_DB_PG_DATABASE=${LAWA_DB_PG_DATABASE}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX=${PINECONE_INDEX}
      - PINECONE_ENVIRONMENT=${PINECONE_ENVIRONMENT}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EMBED_MODEL=${EMBED_MODEL}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - USE_NAMESPACES=${USE_NAMESPACES:-true}
      - NAMESPACE_PREFIX=${NAMESPACE_PREFIX:-website_domain}
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8001}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG=${DEBUG:-false}
      - RELOAD=${RELOAD:-false}
      - MAX_CONCURRENT_TASKS=${MAX_CONCURRENT_TASKS:-5}
      - DEFAULT_MAX_PAGES=${DEFAULT_MAX_PAGES:-100}
      - INDEXING_API_TOKEN=${INDEXING_API_TOKEN}
      - WEBHOOK_SIGNING_SECRET=${WEBHOOK_SIGNING_SECRET}
      - RATE_LIMIT_REQUESTS_PER_MINUTE=${RATE_LIMIT_REQUESTS_PER_MINUTE:-60}
      - RATE_LIMIT_BURST_SIZE=${RATE_LIMIT_BURST_SIZE:-10}
      - DATA_DIR=/app/data
    volumes:
      # Persist data directories (optional)
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
